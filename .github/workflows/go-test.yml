name: go-test

# Go build + test for the v1-go-rewrite. Runs on:
#   - PRs targeting v1-go-rewrite (or any branch off it whose PR base is
#     v1-go-rewrite),
#   - direct pushes to v1-go-rewrite,
#   - manual workflow_dispatch (for one-off runs from a fork or the UI).
#
# Intentionally NOT gated on `main` — Python v0.6.x still ships from main,
# and there's no Go code on main until the cutover PR. The existing
# `test.yml` (pytest matrix) continues to gate `main`.
#
# Path filter keeps the runner cheap on doc-only / Python-only changes:
# we only spin Go up when go.mod, Makefile, Go source, or this workflow
# itself moved.

on:
  push:
    branches:
      - v1-go-rewrite
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/go-test.yml'
  pull_request:
    branches:
      - v1-go-rewrite
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/go-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }} / go${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Match go.mod's `go 1.22` directive. We test the floor (1.22)
        # plus the current stable (1.24) so a release that bumps the
        # toolchain doesn't silently regress on supported floors.
        os: [ubuntu-latest]
        go-version: ["1.22", "1.24"]
        include:
          - os: macos-latest
            go-version: "1.22"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: make build

      - name: Test
        run: make test
