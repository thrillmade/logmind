name: publish

# Triggered on tag push (e.g. v0.1.0). Builds the sdist + wheel and pushes
# to PyPI via OIDC (configure logmind as a "Trusted Publisher" on PyPI;
# no long-lived API token required). Then creates a GitHub Release with
# the artifacts and the matching CHANGELOG section.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # for the GitHub Release
  id-token: write    # for PyPI OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/logmind
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Pull the [tag] section out of CHANGELOG.md (best-effort; falls
          # back to the [Unreleased] section if the tag heading isn't there yet).
          awk -v tag="$tag" '
            $0 ~ "^## \\[" tag "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            awk '
              /^## \[Unreleased\]/ { in_section=1; next }
              in_section && /^## \[/ { exit }
              in_section { print }
            ' CHANGELOG.md > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: false
