name: release

on:
  push:
    tags:
      - "v[1-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: hello
        run: echo "release triggered for tag=${{ github.ref_name }}"
