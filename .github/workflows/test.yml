name: test

# Go test matrix + required-check aggregator. Replaces the pytest matrix
# (Python codebase) at the v0.6.x → v1.0.0 Go-rewrite cutover.
#
# The `test` aggregator job below is pinned by the org-default-protection
# ruleset's required_status_checks (context: "test"), so the aggregator
# MUST keep that exact name. Matrix-expanded cells produce per-cell
# contexts like `go (ubuntu-latest / go1.22)` which don't satisfy the gate
# on their own — the aggregator is the single status that the gate reads.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    # Per-matrix-cell test runner. Each cell reports its own status
    # context (e.g. "go (ubuntu-latest / go1.22)") because matrix-expanded
    # jobs replace the job-id-based context with the `name:` template.
    name: go (${{ matrix.os }} / go${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    env:
      # Guard against the macOS "signal: abort trap" SIGABRT that crashes
      # go test binaries on startup on newer runner images (no-op on Linux).
      MallocNanoZone: "0"
    strategy:
      fail-fast: false
      matrix:
        # Match go.mod's `go 1.22` floor. We test the floor (1.22) plus
        # the current stable (1.24) so a toolchain bump doesn't silently
        # regress on supported floors. macOS cell exercises the same
        # platform the release pipeline signs + notarizes on.
        os: [ubuntu-latest]
        go-version: ["1.22", "1.24"]
        include:
          # Pinned to macos-14: macos-latest rolled to an image where go1.22
          # test binaries abort on startup ("signal: abort trap"), red-lighting
          # every PR. macos-14 is a known-good image for the go1.22 floor.
          # Revisit when the go floor moves past 1.22.
          - os: macos-14
            go-version: "1.22"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build
        run: make build
      - name: Test
        run: make test

  lint:
    # gofmt + vet gate. CI previously had no formatting/vet check, so
    # unformatted files accumulated silently. Runs once (not per matrix
    # cell); the `test` aggregator below `needs` it, so a lint failure
    # red-lights the required check.
    name: lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      # Same drift sentinel every logmind workflow with a hardcoded branch
      # filter carries. `on: push: branches: [main]` above is a literal, so
      # renaming this repository's default branch would stop the push-side
      # matrix forever with no symptom — a check that stops running reports
      # nothing at all. Runs on the `pull_request` trigger, which is exactly
      # why it still fires when the stale `push` filter never would.
      # Advisory: this is repository configuration drift, not a defect in
      # the pull request being tested.
      - name: Warn if the trigger no longer matches the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAFFOLDED_BRANCH: main
        run: |
          set -euo pipefail
          if [ "$SCAFFOLDED_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "::warning title=The test workflow is wired to the wrong branch::This workflow's 'on: push:' filter says '$SCAFFOLDED_BRANCH', but this repository's default branch is now '$DEFAULT_BRANCH'. Pushes to '$DEFAULT_BRANCH' therefore no longer run the test matrix. Fix: edit the 'branches:' filter in .github/workflows/test.yml."
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::These Go files are not gofmt-formatted (run: gofmt -w <file>):"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are gofmt-formatted."
      - name: go vet
        run: go vet ./...

  test:
    # Aggregator under the literal `test` context — the org ruleset's
    # required_status_checks rule pins this exact name. Without this
    # aggregator the gate would never see a producing job because every
    # matrix-expanded cell reports under its own `go (…)` context.
    # `needs:` blocks until every cell completes; `if: always()` plus the
    # inner `result` check propagates failure correctly when any cell
    # fails.
    needs: [go, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate matrix results
        run: |
          if [ "${{ needs.go.result }}" != "success" ]; then
            echo "::error::One or more go test matrix cells failed (needs.go.result=${{ needs.go.result }})"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint (gofmt/vet) failed (needs.lint.result=${{ needs.lint.result }})"
            exit 1
          fi
          echo "All go test matrix cells + lint passed."
