name: check derived docs

# Derived-file architecture: docs/timeline.md is a derived artifact,
# deterministically computed from sources (per-branch logs + decisions.md
# + archive). This workflow VERIFIES that docs/timeline.md on the PR
# matches what `logmind timeline` would produce — same pattern as
# Prettier/ESLint/Black checks. If stale, the build fails red with a
# clear message and the user regenerates locally + pushes.
#
# Why fail-fast instead of auto-commit: GitHub deliberately blocks
# GITHUB_TOKEN-pushed commits from triggering downstream workflows
# (anti-recursion safety). An auto-commit approach leaves required
# status checks stuck on "Expected — Waiting for status to be reported"
# forever. Fail-fast avoids this entire class of problem — no PAT,
# no token games.
#
# Post-cutover: builds the Go binary from this PR's source instead of
# `pip install -e .` (Python source tree removed in #149).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-derived-docs:
    name: check-derived-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build logmind from source
        run: make build

      - name: Verify docs/timeline.md is current
        run: |
          set -euo pipefail
          if [ ! -f docs/timeline.md ]; then
            echo "::error::docs/timeline.md is missing. Run \`logmind timeline --write docs/timeline.md\` and commit the file."
            exit 1
          fi
          ./bin/logmind timeline --write docs/timeline.md
          if ! git diff --quiet docs/timeline.md; then
            echo "::error::docs/timeline.md is stale. Run \`logmind timeline --write docs/timeline.md\` locally and commit the regenerated file."
            git --no-pager diff docs/timeline.md | head -50
            exit 1
          fi
          echo "docs/timeline.md is up to date."
