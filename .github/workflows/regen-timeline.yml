name: logmind / check-derived-docs

# v2.0.0 derived-docs-on-main. The derived docs are regenerated ONLY here on
# main. On a PR this gate is NON-mutating and BLOCKING: it fails if the branch
# edited any derived doc (which would cause cross-PR merge conflicts). A
# branch's real decisions live in docs/decisions-branches/<branch>.md; the
# timeline, its archive and file-structure regenerate on main after merge.
#
# v10: the zero-conflict invariant is now UNCONDITIONAL for every repo running
# this workflow — v9's per-repo `derived_docs.mode: integration-point`
# adoption gate (and its "hasn't opted in → pass" escape) is removed. The
# blocking check always applies; there is no way to opt out from within a PR.
#
# v11: regen-on-main's push step no longer treats "no credential" and "push
# refused" alike (SPEC-2 §3.3, logmind#262). No credential still degrades —
# warn + exit 0. A push that was attempted and refused now fails the job
# (::error + exit 1): it is the job not doing its job, and reporting it as
# success is how a regenerator stays broken for weeks while every run is
# green.
#
# v13: docs/timeline-archive.md joins the gate (SPEC §3.3, logmind#265). The
# history is now rendered in two halves — docs/timeline.md carries the 50 most
# recent entries and the archive the remainder — and §3.3 governs all three
# alike: "A non-default branch MUST NOT modify any derived file — the history,
# its archive, or the map." A branch that edits the archive is blocked exactly
# as one that edits the timeline.
#
# NOTE on the version number: this was v12 until logmind#301 round 5 caught
# it colliding with a DIFFERENT, already in-flight v12 (logmind#314) — two
# branches independently bumped v11 to v12 with unrelated content, and nothing
# compared the two beyond the marker string matching. This archive change
# moves to v13 so the two numbers stay one-to-one with one piece of content
# each.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write        # regen-on-main commits + pushes the regen to main
  pull-requests: read    # the PR gate reads the PR file list via `gh pr diff`
  # NOTE: specifying ANY permission zeroes all others (GitHub default), so
  # pull-requests MUST be listed explicitly — without it `gh pr diff` 403s and
  # the gate fails-closed on EVERY PR, not just violators.

jobs:
  check-derived-docs:
    name: check-derived-docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # NO checkout, deliberately. This job only needs the PR's file list —
      # never the PR's own content — via `gh pr diff`. A checkout on a
      # pull_request event lands refs/pull/N/merge (the PR's own content);
      # staying checkout-free means there is nothing here for a PR to
      # influence about its own gate.
      - name: Assert the branch did not edit the derived docs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          if printf '%s\n' "$changed" | grep -qxE 'docs/(timeline|timeline-archive|file-structure)\.md'; then
            echo "::error title=Derived docs were edited on this branch::This PR modifies docs/timeline.md, docs/timeline-archive.md and/or docs/file-structure.md. These are DERIVED, main-only artifacts; editing them on a branch causes the cross-PR merge conflicts v2.0.0 eliminates. Fix: revert them to main's version — run 'logmind warp', or 'git checkout origin/main -- docs/timeline.md docs/timeline-archive.md docs/file-structure.md' — then commit. Their real content regenerates on main after merge."
            exit 1
          fi
          echo "Branch did not edit the derived docs — the merge cannot conflict on them."

  regen-on-main:
    name: regen-on-main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true
      - name: Build logmind from source
        run: make build
      - name: Regenerate derived docs
        run: |
          set -euo pipefail
          ./bin/logmind timeline --write docs/timeline.md
          ./bin/logmind file-structure --write docs/file-structure.md
      # Mint a 1-hour installation token for the `skdd-steward[bot]` App
      # (org secrets keep their legacy THRILLMADE_ORCHESTRATOR_* names). This
      # identity — NOT a PAT — is the one carrying ruleset bypass, which the
      # push below REQUIRES: `main` is governed by a "changes must be made
      # through a pull request" rule, so a plain credentialed push is rejected
      # with GH013 no matter how much repo scope the token has.
      # See docs/orchestrator-app.md for the App spec + rotation.
      - name: Mint steward App installation token
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          # KEEP `app-id` — see the note in release.yml. app-id and client-id
          # are different values; this secret holds the numeric App ID, which
          # `client-id` does not accept. The deprecation warning is cosmetic.
          app-id: ${{ secrets.THRILLMADE_ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.THRILLMADE_ORCHESTRATOR_PRIVATE_KEY }}
          owner: thrillmade
          repositories: logmind

      - name: Commit + push if changed
        env:
          STEWARD_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/timeline.md docs/timeline-archive.md docs/file-structure.md)" ]; then
            echo "Derived docs already current on main."
            exit 0
          fi
          if [ -z "${STEWARD_TOKEN:-}" ]; then
            echo "::warning title=Derived docs stale on main::Could not mint a steward token; cannot push the regen. This will keep failing on every run until the skdd-steward[bot] App credentials (THRILLMADE_ORCHESTRATOR_APP_ID / THRILLMADE_ORCHESTRATOR_PRIVATE_KEY) are fixed — it will NOT self-heal on the next merge. (No conflict risk — this is a freshness-only gap: branches never modify the derived docs, so nothing can conflict on them.)"
            exit 0
          fi
          git config user.name "skdd-steward[bot]"
          git config user.email "skdd-steward[bot]@users.noreply.github.com"
          git add docs/timeline.md docs/timeline-archive.md docs/file-structure.md
          git commit -m "[skip-logmind] chore: regen derived docs"
          # SPEC-2 §3.3: "Three outcomes, and they MUST NOT look alike."
          # No credential (above) degrades — a warning and a successful
          # exit, because a merge that was otherwise fine should not fail
          # over it. A push that was attempted and refused is different:
          # "a refused write is the job not doing its job", so unlike the
          # no-credential case this one MUST fail the job, loudly — a
          # rejected push here is not conflict risk (branches never modify
          # the derived docs) but it IS main's derived docs going stale,
          # and reporting it as success is how that stayed invisible for
          # eleven days straight (#262). When the cause is a missing
          # ruleset bypass (GH013, a policy refusal), this is NOT
          # transient: every future push hits the same refusal until a
          # human adds the identity to the bypass list — see the error
          # message below and docs/orchestrator-app.md.
          if ! git push "https://x-access-token:${STEWARD_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main"; then
            echo "::error title=Derived-doc regen push refused::The push was rejected — most likely GH013: the skdd-steward[bot] identity is missing from the 'main' ruleset's bypass list for 'changes must be made through a pull request'. This is a POLICY refusal, not a token-scope problem, so it will NOT self-heal on the next merge — every future push hits the same refusal until the identity is added to the bypass list (see docs/orchestrator-app.md). No conflict risk — branches never modify the derived docs, so nothing can conflict on them — but main's derived docs are now stale and this run failed to fix that."
            exit 1
          fi
