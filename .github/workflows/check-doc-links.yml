name: doc link integrity

# Dogfood version of the workflow that `logmind init` ships into downstream
# projects (see src/logmind/templates/github/check-doc-links.yml.template).
# Installs logmind from the current source tree (pip install -e .) so it
# works against logmind's own docs without depending on PyPI.

on:
  pull_request:
  push:
    branches: [main]

# Note: previously this workflow had a `paths: ["**/*.md", ...]` filter
# to skip runs when no markdown changed. That interacts badly with
# `required_status_checks` in the branch ruleset — GitHub treats a
# filter-skipped check as "expected but missing" and blocks the merge
# forever. Running unconditionally is cheap (~15s end-to-end) and keeps
# the gate predictable.

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install logmind from source
        run: pip install -e .

      - name: Check markdown link integrity
        run: logmind check-links
