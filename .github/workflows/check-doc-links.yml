name: doc link integrity

# Dogfood version of the workflow that `logmind init` ships into
# downstream projects (the template lives in internal/templates/github/).
# Builds the Go binary from this PR's source so it works against
# logmind's own docs without depending on the released binary.

on:
  pull_request:
  push:
    branches: [main]

# Note: previously this workflow had a `paths: ["**/*.md", ...]` filter
# to skip runs when no markdown changed. That interacts badly with
# `required_status_checks` in the branch ruleset — GitHub treats a
# filter-skipped check as "expected but missing" and blocks the merge
# forever. Running unconditionally is cheap (~15s end-to-end) and keeps
# the gate predictable.

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build logmind from source
        run: make build

      - name: Check markdown link integrity
        run: ./bin/logmind check-links
