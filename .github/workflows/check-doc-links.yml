name: logmind / check-links

# Dogfood version of the workflow that `logmind init` ships into
# downstream projects (the template lives in internal/templates/github/).
# Builds the Go binary from this PR's source so it works against
# logmind's own docs without depending on the released binary.

on:
  pull_request:
  push:
    branches: [main]

# Note: previously this workflow had a `paths: ["**/*.md", ...]` filter
# to skip runs when no markdown changed. That interacts badly with
# `required_status_checks` in the branch ruleset — GitHub treats a
# filter-skipped check as "expected but missing" and blocks the merge
# forever. Running unconditionally is cheap (~15s end-to-end) and keeps
# the gate predictable.

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      # First, and dependency-free on purpose: this must still report even
      # when the build below fails. This repo runs a dogfood variant of the
      # shipped template, but the `on: push:` filter above is the same
      # hardcoded literal the template renders at scaffold time — so it
      # carries the same failure mode, and carrying it without the sentinel
      # is how logmind would ship a warning it does not run itself. Renaming
      # this repo's default branch would otherwise stop link checking on it
      # silently, because a check that stops running reports nothing at all.
      # This step is on the `pull_request` trigger, which is why it still
      # fires when the stale `push` filter never would.
      - name: Warn if the trigger no longer matches the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAFFOLDED_BRANCH: main
        run: |
          set -euo pipefail
          if [ "$SCAFFOLDED_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "::warning title=check-links is wired to the wrong branch::This workflow's 'on: push:' filter says '$SCAFFOLDED_BRANCH', but this repository's default branch is now '$DEFAULT_BRANCH'. Link checking therefore no longer runs on pushes to '$DEFAULT_BRANCH' — silently, because a check that stops running reports nothing at all. Fix: edit the 'branches:' filter in this file (it is logmind's own dogfood copy, not a scaffolded one, so 'logmind init --refresh' will not rewrite it)."
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true

      - name: Build logmind from source
        run: make build

      - name: Check markdown link integrity
        run: ./bin/logmind check-links
