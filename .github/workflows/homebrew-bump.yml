name: homebrew tap bump

# Fires after a PyPI release tag is pushed and opens a bump PR on
# thrillmot/homebrew-logmind. Uses dawidd6/action-homebrew-bump-formula,
# which knows how to compute the new tarball SHA from the URL and edit the
# formula in place.
#
# Requires a repo secret HOMEBREW_TAP_PAT — a fine-grained PAT scoped to
# thrillmot/homebrew-logmind with these permissions:
#   - Contents: Read and write
#   - Pull requests: Read and write
# (GITHUB_TOKEN from this repo cannot write to a different repo, so a PAT
# is required. A GitHub App token would also work.)
#
# Manual override: trigger via "Run workflow" with a specific tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to bump to (e.g. v0.1.3). Defaults to the latest release."
        required: false

permissions:
  contents: read

jobs:
  homebrew-bump:
    name: open bump PR on tap
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          # Strip leading v if present, so {0.1.3, v0.1.3} both work.
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI to surface the new release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/logmind/${VERSION}/json" > /dev/null; then
              echo "PyPI has logmind ${VERSION}."
              exit 0
            fi
            echo "Waiting for PyPI propagation (attempt ${i}/30)..."
            sleep 10
          done
          echo "::error::PyPI did not surface logmind ${VERSION} within 5 minutes."
          exit 1

      - name: Install Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Open bump PR on homebrew-logmind
        env:
          # Brew uses this for both auth (gh API calls + PR creation) and
          # git push. PAT must have Contents+PR write on the tap repo.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          # Tap the formula locally so `bump-formula-pr` can find it.
          brew tap thrillmot/logmind https://github.com/thrillmot/homebrew-logmind
          # --no-pip-resources: skip the Python-resource auto-update path
          # that fails on fresh PyPI uploads (homebrew's `--uploaded-prior-to`
          # safety refuses to look at packages <24h old). The formula's
          # `click` + `pyyaml` resources rarely change between logmind patch
          # releases, so a follow-up PR can refresh them if needed.
          # --no-fork: push directly to the tap (HOMEBREW_TAP_PAT has write).
          # --no-browse: don't try to open a browser on the CI runner.
          # --no-audit: skip the full audit; tap CI (if any) re-runs it.
          brew bump-formula-pr \
            --no-pip-resources \
            --no-fork \
            --no-browse \
            --no-audit \
            --version="${VERSION}" \
            thrillmot/logmind/logmind
